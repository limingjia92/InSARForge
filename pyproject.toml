[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "insarforge"
version = "0.1.0.dev0"
description = "A research-oriented multi-mission, multi-backend InSAR workflow, correction, and analysis framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
insarforge = "insarforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
